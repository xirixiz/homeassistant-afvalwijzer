services:
  afvalwijzer:
    image: "ghcr.io/home-assistant/home-assistant:latest"
    volumes:
      - ./config:/config
      - ./custom_components/afvalwijzer:/config/custom_components/afvalwijzer
    restart: unless-stopped
    ports:
      - 8123:8123
    # Restart Home Assistant when the component changes (needs Docker Compose 2.32+).
    # Run with `docker compose up --watch`, or `scripts/develop`.
    develop:
      watch:
        - action: restart
          path: ./custom_components/afvalwijzer
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
