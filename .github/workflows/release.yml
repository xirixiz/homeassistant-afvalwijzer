name: "Afvalwijzer: Release"

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9]+"
      - "[0-9][0-9][0-9][0-9].[0-9]+.0b[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: "ubuntu-latest"
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify manifest and const versions match the tag
        run: scripts/verify-version "$TAG"
      - name: Determine release type
        id: release_type
        run: |
          if [[ "$TAG" =~ b[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - run: zip -r ../../afvalwijzer.zip . -x "*/__pycache__/*" "__pycache__/*"
        working-directory: custom_components/afvalwijzer
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: "afvalwijzer.zip"
          generate_release_notes: true
          prerelease: ${{ steps.release_type.outputs.prerelease }}
