name: "Afvalwijzer: Daily Test"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  test-module:
    runs-on: "ubuntu-latest"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # audit, not block: this job calls dozens of live waste-provider
          # APIs on arbitrary domains, which can't be pinned to a fixed
          # allowed-endpoints list.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install -r requirements.txt
      - name: Enable all addresses
        run: sed -i 's/#{"provider"/{"provider"/g' tests/test_data.py
      - name: Test module
        run: |
          set -o pipefail
          scripts/test-module --show-failures-only 2>&1 | tee $GITHUB_STEP_SUMMARY
